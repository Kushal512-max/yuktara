# Netlify Deployment Configuration for YUKTARA
# PostgreSQL backend via Netlify Functions

[build]
  publish = "."
  functions = "netlify/functions"

# Route all /api/* calls to the corresponding Netlify Functions
# The function filename maps to the route segment after /api/

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/auth/register"
  to = "/.netlify/functions/auth-register"
  status = 200

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/auth/logout"
  to = "/.netlify/functions/auth-logout"
  status = 200

[[redirects]]
  from = "/api/client-context"
  to = "/.netlify/functions/client-context"
  status = 200

[[redirects]]
  from = "/api/quiz/attempt"
  to = "/.netlify/functions/quiz-attempt"
  status = 200

[[redirects]]
  from = "/api/quiz/attempts"
  to = "/.netlify/functions/quiz-attempt"
  status = 200

[[redirects]]
  from = "/api/study/session"
  to = "/.netlify/functions/study-session"
  status = 200

[[redirects]]
  from = "/api/admin/data"
  to = "/.netlify/functions/admin-data"
  status = 200

[[redirects]]
  from = "/api/admin/query"
  to = "/.netlify/functions/admin-query"
  status = 200

[[redirects]]
  from = "/api/admin/export"
  to = "/.netlify/functions/admin-export"
  status = 200

[[redirects]]
  from = "/api/admin/user-detail"
  to = "/.netlify/functions/admin-user-detail"
  status = 200

[[redirects]]
  from = "/api/init-db"
  to = "/.netlify/functions/init-db"
  status = 200

# SPA fallback — all non-file, non-api routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
